<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPI Test - Fulani Hair Gro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; color: #fff; padding: 20px; }
    h1 { color: #f5c518; margin-bottom: 10px; }
    .banner { background: #f5c518; color: #000; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
    .banner h2 { font-size: 24px; margin-bottom: 8px; }
    .status { padding: 15px; border-radius: 8px; margin: 10px 0; font-family: monospace; font-size: 14px; }
    .pending { background: #333; border: 1px solid #555; }
    .success { background: #1a3a1a; border: 1px solid #2d6b2d; color: #4ade80; }
    .error { background: #3a1a1a; border: 1px solid #6b2d2d; color: #f87171; }
    .events { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0; }
    .event-badge { background: #000; color: #f5c518; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; }
    button { background: #f5c518; color: #000; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin: 10px 0; }
    button:hover { background: #d4a810; }
    button:disabled { background: #555; color: #999; cursor: not-allowed; }
    #log { background: #1a1a2e; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-top: 15px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.6; }
    .log-success { color: #4ade80; }
    .log-error { color: #f87171; }
    .log-info { color: #60a5fa; }
    .log-warn { color: #fbbf24; }
  </style>
</head>
<body>
  <div class="banner">
    <h2>CAPI TEST MODE</h2>
    <p>Test Event Code: <strong id="testCodeDisplay">TEST34703</strong></p>
    <p style="font-size: 13px; margin-top: 5px;">Pixel ID: 220381209723501</p>
  </div>

  <div class="events">
    <span class="event-badge" id="badge-formstart">FormStart</span>
    <span class="event-badge" id="badge-addtocart">AddToCart</span>
    <span class="event-badge" id="badge-initiatecheckout">InitiateCheckout</span>
    <span class="event-badge" id="badge-purchase">Purchase</span>
    <span class="event-badge" id="badge-highvalue">HighValuePurchase</span>
  </div>

  <div style="text-align: center;">
    <button id="fireBtn" onclick="fireAllEvents()">FIRE ALL CAPI TEST EVENTS</button>
  </div>

  <div id="result" class="status pending">Waiting... Click the button above to fire test events to Meta.</div>

  <div id="log"></div>

  <script>
    const PIXEL_ID = '220381209723501';
    const META_ACCESS_TOKEN = 'EAANBi9i7mZAABQLWJEFT1pCHgkBoudFR93ILCLcBNEHJKOA3L2b0eIlOUrgZBtW4OUEJ3MEV6NyAMfXrKExXLQqS5Io3OBh4MHEZBE6vDVBVUe0iTdjwZCNTTzMXZBtrbLKIWm226zrNQO9YRhpFHvpqGjfZBdJrDZB3ZB4uZAN2kxVJAMf7G9DNzxZCPuSqk6V1pe9AZDZD';
    const META_CAPI_URL = `https://graph.facebook.com/v21.0/${PIXEL_ID}/events`;

    const params = new URLSearchParams(window.location.search);
    const TEST_CODE = params.get('test_code') || 'TEST34703';
    document.getElementById('testCodeDisplay').textContent = TEST_CODE;

    function log(msg, type = 'info') {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      line.className = `log-${type}`;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }

    async function sha256(str) {
      if (!str) return '';
      const normalized = str.trim().toLowerCase();
      const data = new TextEncoder().encode(normalized);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function markBadge(id, success) {
      const el = document.getElementById(id);
      el.style.background = success ? '#166534' : '#991b1b';
      el.style.color = '#fff';
      el.textContent += success ? ' ✓' : ' ✗';
    }

    async function sendEvent(eventName, customData = {}) {
      const hashedEmail = await sha256('test@example.com');
      const hashedPhone = await sha256('08012345678');
      const hashedFn = await sha256('test');
      const hashedLn = await sha256('customer');
      const hashedCt = await sha256('lagos');
      const hashedSt = await sha256('lagos');
      const hashedZp = await sha256('101001');
      const hashedCountry = await sha256('ng');

      const eventId = `test_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;

      const payload = {
        data: [{
          event_name: eventName,
          event_time: Math.floor(Date.now() / 1000),
          action_source: 'website',
          event_id: eventId,
          user_data: {
            em: hashedEmail,
            ph: hashedPhone,
            fn: hashedFn,
            ln: hashedLn,
            ct: hashedCt,
            st: hashedSt,
            zp: hashedZp,
            country: hashedCountry,
            client_user_agent: navigator.userAgent
          },
          custom_data: {
            currency: 'NGN',
            value: customData.value || 0,
            content_type: 'product',
            content_name: customData.content_name || 'Fulani Hair Gro',
            ...customData
          }
        }],
        test_event_code: TEST_CODE
      };

      log(`Sending ${eventName} to Meta...`, 'info');
      log(`Payload: ${JSON.stringify(payload, null, 2)}`, 'info');

      const url = `${META_CAPI_URL}?access_token=${META_ACCESS_TOKEN}`;
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await resp.json();

      if (data.events_received) {
        log(`${eventName}: SUCCESS - events_received: ${data.events_received}`, 'success');
        return true;
      } else {
        log(`${eventName}: FAILED - ${JSON.stringify(data)}`, 'error');
        return false;
      }
    }

    async function fireAllEvents() {
      const btn = document.getElementById('fireBtn');
      const result = document.getElementById('result');
      btn.disabled = true;
      btn.textContent = 'SENDING EVENTS...';
      result.className = 'status pending';
      result.textContent = 'Sending events to Meta...';

      let successCount = 0;

      try {
        // 1. FormStart
        if (await sendEvent('FormStart', { content_name: 'Fulani Hair Gro Form' })) {
          markBadge('badge-formstart', true); successCount++;
        } else { markBadge('badge-formstart', false); }

        // 2. AddToCart
        if (await sendEvent('AddToCart', { value: 66750, content_name: 'SELF LOVE PLUS' })) {
          markBadge('badge-addtocart', true); successCount++;
        } else { markBadge('badge-addtocart', false); }

        // 3. InitiateCheckout
        if (await sendEvent('InitiateCheckout', { value: 71750, content_name: 'SELF LOVE PLUS', num_items: 3 })) {
          markBadge('badge-initiatecheckout', true); successCount++;
        } else { markBadge('badge-initiatecheckout', false); }

        // 4. Purchase
        if (await sendEvent('Purchase', { value: 71750, content_name: 'SELF LOVE PLUS', num_items: 3, order_id: 'TEST_ORDER_123' })) {
          markBadge('badge-purchase', true); successCount++;
        } else { markBadge('badge-purchase', false); }

        // 5. HighValuePurchase (custom)
        if (await sendEvent('HighValuePurchase', { value: 71750, content_name: 'SELF LOVE PLUS', is_wealthy_area: true, area_tier: 'ultra_premium', is_lagos_island: true })) {
          markBadge('badge-highvalue', true); successCount++;
        } else { markBadge('badge-highvalue', false); }

        result.className = successCount === 5 ? 'status success' : 'status error';
        result.textContent = `${successCount}/5 events sent successfully! Check Meta Events Manager → Test Events tab.`;
        log(`DONE: ${successCount}/5 events received by Meta`, successCount === 5 ? 'success' : 'warn');

      } catch (err) {
        result.className = 'status error';
        result.textContent = `Error: ${err.message}`;
        log(`FATAL ERROR: ${err.message}`, 'error');
      }

      btn.disabled = false;
      btn.textContent = 'FIRE ALL CAPI TEST EVENTS AGAIN';
    }
  </script>
</body>
</html>
